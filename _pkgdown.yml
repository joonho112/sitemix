url: https://joonho112.github.io/sitemix/

development:
  mode: release

template:
  bootstrap: 5
  math-rendering: katex
  includes:
    in_header: |
      <style>
      .katex-display {
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding-block: 0.3rem;
      }
      .katex-display > .katex {
        display: inline-block;
        min-width: 100%;
      }
      </style>
  bootswatch: cosmo
  bslib:
    primary: '#1B4965'
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "sitemix hex sticker — site- and group-level sampling uncertainty"
    twitter:
      creator: "@joonho112"
      card: summary_large_image

authors:
  JoonHo Lee:
    html: "JoonHo Lee ([jlee296@ua.edu](mailto:jlee296@ua.edu))"

home:
  title: "sitemix — Site-level proportions and sampling uncertainty"
  description: |
    Estimate proportions and sampling uncertainty from student records,
    counts, or published aggregates. Return standard errors and optional
    covariance matrices, with diagnostics and tools for suppressed data
    and sensitivity analysis.
  links:
  - text: "Getting started"
    href: articles/a1-getting-started.html
  - text: "Choose an input format"
    href: articles/a2-input-formats.html
  - text: "Understand sampling uncertainty"
    href: articles/m1-statistical-foundations.html
  sidebar:
    structure: [links, license, community, citation, authors, dev]

navbar:
  structure:
    left:  [intro, reference, articles, methods, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/a1-getting-started.html
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/a1-getting-started.html
      - text: Choosing an input format
        href: articles/a2-input-formats.html
      - text: Binary proportions
        href: articles/a3-scenario-binomial.html
      - text: Overlapping indicators and categories
        href: articles/a4-multivariate-multinomial.html
      - text: Published aggregates
        href: articles/a5-published-aggregates.html
      - text: Diagnostics and suppressed data
        href: articles/a6-diagnostics-and-suppression.html
      - text: Smoothing and sensitivity analysis
        href: articles/a7-variance-smoothing-and-frechet.html
      - text: Using estimates in further analyses
        href: articles/a8-downstream-workflows.html
      - text: A complete simulated example
        href: articles/a9-case-study-end-to-end.html
    methods:
      text: Methods
      menu:
      - text: Sampling uncertainty
        href: articles/m1-statistical-foundations.html
      - text: Binomial SEs and transformations
        href: articles/m2-scalar-se-binomial.html
      - text: Covariance for overlapping indicators
        href: articles/m3-multivariate-sur-covariance.html
      - text: Multinomial covariance
        href: articles/m4-multinomial-simplex.html
      - text: Uncertainty from aggregates
        href: articles/m5-aggregate-engines.html
      - text: Experimental variance smoothing
        href: articles/m6-variance-smoothing-theory.html
      - text: Fréchet bounds and projections
        href: articles/m7-frechet-envelope-theory.html
      - text: Understanding returned estimates
        href: articles/m8-output-contract.html
    github:
      icon: fab fa-github
      href: https://github.com/joonho112/sitemix
      aria-label: GitHub

articles:
- title: Applied examples
  desc: >
    Choose an input format, estimate proportions, check the results,
    and use their uncertainty in further analyses.
  navbar: ~
  contents:
  - a1-getting-started
  - a2-input-formats
  - a3-scenario-binomial
  - a4-multivariate-multinomial
  - a5-published-aggregates
  - a6-diagnostics-and-suppression
  - a7-variance-smoothing-and-frechet
  - a8-downstream-workflows
  - a9-case-study-end-to-end

- title: Methods
  desc: >
    Assumptions and formulas for standard errors, covariance,
    aggregate data, variance smoothing, and Fréchet sensitivity analysis.
  navbar: ~
  contents:
  - m1-statistical-foundations
  - m2-scalar-se-binomial
  - m3-multivariate-sur-covariance
  - m4-multinomial-simplex
  - m5-aggregate-engines
  - m6-variance-smoothing-theory
  - m7-frechet-envelope-theory
  - m8-output-contract

reference:
- title: Package overview
  contents:
  - sitemix-package

- title: Estimate proportions
  desc: >
    Estimate site-year proportions from student records, counts, or
    published aggregates. The count and aggregate wrappers select the
    corresponding input path.
  contents:
  - sm_estimate
  - sm_estimate_from_counts
  - sm_estimate_from_aggregates

- title: Check estimates and suppression
  desc: >
    Examine returned estimates and covariance, or summarize suppression
    and denominator thresholds in a publisher's input table.
  contents:
  - sm_diagnose
  - sm_suppression_report

- title: Covariance and dependence
  desc: >
    Inspect covariance matrices and explore dependence when only marginal
    counts are available. Fréchet results separate pairwise intervals
    from projected dependence scenarios.
  contents:
  - sm_vcov
  - sm_frechet_envelope

- title: Experimental variance smoothing
  desc: >
    Fit a log-variance model to eligible rows. The function adds alternative
    standard errors by default; improved performance is not guaranteed.
  contents:
  - sm_smooth_variance

- title: Reshape subgroup data
  desc: >
    Prepare subgroup tables for estimation. Treat subgroups as separate
    sites or as indicators within a site, according to the analysis.
  contents:
  - sm_pivot_subgroups_to_sites
  - sm_pivot_subgroups_to_indicators

- title: Simulated example data
  desc: A simulated pre-kindergarten panel for learning and checking the methods.
  contents:
  - prek_sim

footer:
  structure:
    left: developed_by
    right: built_with

redirects:
- ["articles/a8-eb-handoff.html", "articles/a8-downstream-workflows.html"]
- ["articles/m8-eb-handoff-walters-2024.html", "articles/m8-output-contract.html"]
